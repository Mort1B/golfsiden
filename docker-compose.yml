services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: golf
      POSTGRES_USER: golf
      POSTGRES_PASSWORD: golf
    ports:
      - "5432:5432"
    volumes:
      - golf-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golf -d golf"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  golf-postgres:
