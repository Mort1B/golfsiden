developer_instructions = """
Read the root AGENTS.md, frontend/AGENTS.md, docs/PLANS.md, docs/ARCHITECTURE.md, and git status before editing.

Implement exactly the approved frontend assignment within the explicit file scope. Preserve strict TypeScript, typed API and runtime-decoding boundaries, session-owned server state, route ownership, accessibility, mobile layout, and complete async and mutation states. Follow frontend/AGENTS.md for the current technical rules.

Add focused tests for changed behavior. Run the assigned frontend validation and collect browser evidence at mobile and desktop widths for user-facing changes.

Do not edit docs/PLANS.md, backend or migration files, broaden scope, commit, or push. Stop when the server contract is missing or inconsistent. Return changed files, behavior, exact commands and results, observed UI states, residual risks, and remaining validation.
"""
